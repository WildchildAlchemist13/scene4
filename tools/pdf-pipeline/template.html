<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>$title$ — Scene4</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    @page {
      size: A4;
      margin: 3cm 2.5cm 3cm 2.5cm;
      @bottom-center {
        content: "Scene4 · " counter(page);
        font-family: 'Inter', sans-serif;
        font-size: 9pt;
        color: #888;
      }
    }
    @page :first {
      margin: 0;
      @bottom-center { content: none; }
    }
    html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 11.5pt;
      line-height: 1.85;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
    }
    .cover {
      page-break-after: always;
      background: #0a0a0a;
      color: #ffffff;
      width: 100%;
      min-height: 297mm;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3.5cm 2.5cm;
      position: relative;
      overflow: hidden;
    }
    .cover::before {
      content: "";
      position: absolute;
      top: -100px; right: -100px;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(0, 245, 255, 0.18), transparent 70%);
      pointer-events: none;
    }
    .cover::after {
      content: "";
      position: absolute;
      bottom: -120px; left: -120px;
      width: 380px; height: 380px;
      background: radial-gradient(circle, rgba(255, 0, 255, 0.12), transparent 70%);
      pointer-events: none;
    }
    .cover-mark {
      font-family: 'Orbitron', sans-serif;
      font-size: 11pt;
      font-weight: 700;
      letter-spacing: 8px;
      color: #00f5ff;
      text-transform: uppercase;
      z-index: 2;
    }
    .cover-main { z-index: 2; }
    .cover-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 42pt;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      line-height: 1.1;
      margin: 0 0 1.5rem 0;
      text-transform: uppercase;
    }
    .cover-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 14pt;
      font-weight: 400;
      color: #c0c0c0;
      line-height: 1.4;
      max-width: 28em;
      margin: 0 0 2rem 0;
    }
    .cover-frameworks {
      font-family: 'Orbitron', sans-serif;
      font-size: 9pt;
      font-weight: 500;
      letter-spacing: 4px;
      color: #ff00ff;
      text-transform: uppercase;
      margin-top: 2rem;
    }
    .cover-foot {
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 9pt;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .cover-foot .by { color: #00f5ff; font-family: 'Orbitron', sans-serif; letter-spacing: 4px; }
    .cover-foot .author { color: #ddd; font-weight: 500; margin-top: 4px; }

    .body { padding: 0; }
    .body h1, .body h2, .body h3, .body h4 {
      font-family: 'Inter', sans-serif;
      color: #0a0a0a;
      font-weight: 700;
      line-height: 1.25;
    }
    .body h1 {
      font-size: 28pt;
      border-bottom: 3px solid #00f5ff;
      padding-bottom: 0.4em;
      margin-top: 0;
      margin-bottom: 1.2em;
      page-break-before: always;
      page-break-after: avoid;
      letter-spacing: -0.01em;
    }
    .body h1:first-of-type { page-break-before: auto; }
    .body h2 {
      font-size: 17pt;
      color: #006b7a;
      margin-top: 2em;
      margin-bottom: 0.8em;
      page-break-after: avoid;
    }
    .body h3 {
      font-size: 13.5pt;
      color: #333;
      margin-top: 1.5em;
      margin-bottom: 0.6em;
      page-break-after: avoid;
    }
    .body p { margin: 0.9em 0; orphans: 3; widows: 3; }

    /* Workbook elements — exercises, fill-in spaces */
    .write-space {
      border-bottom: 1px solid #999;
      height: 1.6em;
      margin: 0.8em 0;
    }
    .exercise-block {
      background: #fafbfc;
      border-left: 4px solid #ff00ff;
      padding: 1.2em 1.5em;
      margin: 1.8em 0;
      page-break-inside: avoid;
    }
    .exercise-label {
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      letter-spacing: 3px;
      color: #ff00ff;
      font-size: 10pt;
      text-transform: uppercase;
      margin: 2em 0 0.6em 0;
    }
    .exercise-step {
      font-weight: 600;
      color: #006b7a;
      margin-top: 1.2em;
      margin-bottom: 0.4em;
    }
    .step-rule {
      border-bottom: 1px solid #bbb;
      height: 2.2em;
      margin: 0.4em 0 1.4em 0;
    }
    .body strong { color: #0a0a0a; font-weight: 700; }
    .body em { color: #333; }
    .body ul, .body ol { padding-left: 1.4em; margin: 0.7em 0; }
    .body li { margin: 0.3em 0; }
    .body blockquote {
      border-left: 3px solid #00f5ff;
      padding: 0.4em 1em;
      margin: 1em 0;
      color: #555;
      font-style: italic;
      background: #f8fbfc;
    }
    .body code {
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      font-size: 0.9em;
      background: #f3f3f3;
      padding: 1px 5px;
      border-radius: 3px;
      color: #2a2a2a;
    }
    .body pre {
      background: #0a0a0a;
      color: #00f5ff;
      padding: 1em;
      border-radius: 4px;
      overflow-x: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9pt;
    }
    .body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
      font-size: 9.5pt;
    }
    .body th, .body td {
      border: 1px solid #ddd;
      padding: 6px 10px;
      text-align: left;
    }
    .body th { background: #f5f5f5; font-weight: 600; }
    .body hr { border: 0; border-top: 1px solid #ddd; margin: 2em 0; }
  </style>
</head>
<body>
  <section class="cover">
    <div class="cover-mark">SCENE4</div>
    <div class="cover-main">
      <h1 class="cover-title">$title$</h1>
      <p class="cover-subtitle">$subtitle$</p>
      <p class="cover-frameworks">$frameworks$</p>
    </div>
    <div class="cover-foot">
      <div>
        <div class="by">By</div>
        <div class="author">Revanth Sharma · Founder, Scene4</div>
      </div>
      <div style="text-align:right;color:#666;font-size:8pt;letter-spacing:2px;">
        SCENE4.TECH<br>
        VERTICAL STORYTELLING EDUCATION
      </div>
    </div>
  </section>
  <main class="body">
$body$
  </main>
</body>
</html>
